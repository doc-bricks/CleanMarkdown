[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanmarkdown"
version = "1.0.5"
description = "Fast local Markdown viewer and editor with clean reading mode, raw editor, PDF export, and DE/EN UI."
readme = "README.md"
authors = [
    { name = "doc-bricks", email = "lukas@um-bruch.org" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "markdown",
    "markdown-editor",
    "markdown-viewer",
    "pyside6",
    "python",
    "desktop-app",
    "pdf-export",
    "local-first",
    "offline-first",
    "privacy-first",
    "pwa",
    "distraction-free",
    "doc-bricks",
    "document-viewer",
    "live-preview",
    "open-bricks",
    "session-management",
    "split-view",
    "windows",
    "zero-egress",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Editors",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "PySide6>=6.5.0,!=6.12.0",
    "markdown>=3.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "Pillow>=10.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]
build = [
    "pyinstaller>=6.10.0",
]

[project.urls]
Homepage = "https://github.com/doc-bricks/CleanMarkdown"
Documentation = "https://github.com/doc-bricks/CleanMarkdown#readme"
Repository = "https://github.com/doc-bricks/CleanMarkdown"
Changelog = "https://github.com/doc-bricks/CleanMarkdown/blob/main/CHANGELOG.md"
Contributing = "https://github.com/doc-bricks/CleanMarkdown/blob/main/CONTRIBUTING.md"
Security = "https://github.com/doc-bricks/CleanMarkdown/blob/main/SECURITY.md"
Notice = "https://github.com/doc-bricks/CleanMarkdown/blob/main/NOTICE"
Issues = "https://github.com/doc-bricks/CleanMarkdown/issues"
"Bug Tracker" = "https://github.com/doc-bricks/CleanMarkdown/issues"
"LLM Ready" = "https://raw.githubusercontent.com/doc-bricks/CleanMarkdown/main/llms.txt"
"Security Advisories" = "https://github.com/doc-bricks/CleanMarkdown/security/advisories/new"
Umbrella = "https://github.com/open-bricks"

[tool.pytest.ini_options]
minversion = "9.1.1"
pythonpath = "."
testpaths = ["tests"]
addopts = "-ra -v"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
per-file-ignores = { "generate_store_screenshots.py" = ["E402"], "tests/*" = ["E402"] }
