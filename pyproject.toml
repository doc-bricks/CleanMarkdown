[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanmarkdown"
version = "1.0.0"
description = "Fast local Markdown viewer and editor with clean reading mode, raw editor, PDF export, and DE/EN UI."
readme = "README.md"
authors = [
    { name = "doc-bricks", email = "lukas@um-bruch.org" }
]
license = { text = "MIT" }
keywords = ["markdown", "editor", "viewer", "pyside6", "pdf-export", "local-first", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Editors",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "PySide6>=6.5.0",
    "markdown>=3.4.0",
]

[project.urls]
Homepage = "https://github.com/doc-bricks/CleanMarkdown"
Repository = "https://github.com/doc-bricks/CleanMarkdown"
Changelog = "https://github.com/doc-bricks/CleanMarkdown/blob/main/CHANGELOG.md"
Issues = "https://github.com/doc-bricks/CleanMarkdown/issues"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
